<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7957d5; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #4a4a4a; }
    .lang-pct { font-weight: 700; }
  </style>

  <rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="349" fill="#ffffff" stroke-opacity="1"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Progress bar -->
  <g transform="translate(25, 55)">
    <svg width="300" height="8">
      <rect x="0.0" y="0" width="89.7" height="8" fill="#A97BFF" rx="4" />
      <rect x="89.7" y="0" width="42.1" height="8" fill="#B07219"  />
      <rect x="131.8" y="0" width="39.3" height="8" fill="#555555"  />
      <rect x="171.1" y="0" width="34.7" height="8" fill="#3178C6"  />
      <rect x="205.8" y="0" width="32.4" height="8" fill="#563D7C"  />
      <rect x="238.2" y="0" width="30.6" height="8" fill="#178600" rx="4" />
    </svg>
  </g>

  <!-- Legend 2 columns -->
  <g transform="translate(25, 80)">
    <g transform="translate(0, 0)">
      <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#A97BFF" />
      <text x="18" y="10" class="lang-name">Kotlin <tspan class="lang-pct">29.9%</tspan></text>
    </g>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#B07219" />
      <text x="18" y="10" class="lang-name">Java <tspan class="lang-pct">14.0%</tspan></text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="6" r="5" fill="#555555" />
      <text x="18" y="10" class="lang-name">C <tspan class="lang-pct">13.1%</tspan></text>
    </g>
    </g>
    <g transform="translate(150, 0)">
      <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#3178C6" />
      <text x="18" y="10" class="lang-name">TypeScript <tspan class="lang-pct">11.6%</tspan></text>
    </g>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#563D7C" />
      <text x="18" y="10" class="lang-name">CSS <tspan class="lang-pct">10.8%</tspan></text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="6" r="5" fill="#178600" />
      <text x="18" y="10" class="lang-name">C# <tspan class="lang-pct">10.2%</tspan></text>
    </g>
    </g>
  </g>
</svg>
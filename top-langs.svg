<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7957d5; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #4a4a4a; }
    .lang-pct { font-weight: 700; }
  </style>

  <rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="349" fill="#ffffff" stroke-opacity="1"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Progress bar -->
  <g transform="translate(25, 55)">
    <svg width="300" height="8">
      <rect x="0.0" y="0" width="123.1" height="8" fill="#A97BFF" rx="4" />
      <rect x="123.1" y="0" width="47.6" height="8" fill="#3178C6"  />
      <rect x="170.7" y="0" width="44.5" height="8" fill="#563D7C"  />
      <rect x="215.2" y="0" width="42.0" height="8" fill="#178600"  />
      <rect x="257.2" y="0" width="20.0" height="8" fill="#E34C26"  />
      <rect x="277.2" y="0" width="19.9" height="8" fill="#3572A5" rx="4" />
    </svg>
  </g>

  <!-- Legend 2 columns -->
  <g transform="translate(25, 80)">
    <g transform="translate(0, 0)">
      <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#A97BFF" />
      <text x="18" y="10" class="lang-name">Kotlin <tspan class="lang-pct">41.0%</tspan></text>
    </g>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#3178C6" />
      <text x="18" y="10" class="lang-name">TypeScript <tspan class="lang-pct">15.9%</tspan></text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="6" r="5" fill="#563D7C" />
      <text x="18" y="10" class="lang-name">CSS <tspan class="lang-pct">14.8%</tspan></text>
    </g>
    </g>
    <g transform="translate(150, 0)">
      <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#178600" />
      <text x="18" y="10" class="lang-name">C# <tspan class="lang-pct">14.0%</tspan></text>
    </g>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#E34C26" />
      <text x="18" y="10" class="lang-name">HTML <tspan class="lang-pct">6.7%</tspan></text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text x="18" y="10" class="lang-name">Python <tspan class="lang-pct">6.6%</tspan></text>
    </g>
    </g>
  </g>
</svg>